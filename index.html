<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Online</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 10px;
            font-size: 14px;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #e6f4ea;
            border: 2px dashed #137333;
            border-radius: 8px;
            display: none;
        }
        .resultado-box h2 {
            color: #137333;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .ganhador {
            font-size: 24px;
            font-weight: bold;
            color: #1b5e20;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sorteio Online</h1>
    <p>Insira os nomes (um por linha):</p>
    <textarea id="nomes" placeholder="Exemplo:&#10;João&#10;Maria&#10;Pedro"></textarea>
    
    <button onclick="realizarSorteio()">Sortear!</button>

    <div id="resultadoBox" class="resultado-box">
        <h2>🎉 O nome sorteado foi:</h2>
        <div id="ganhador" class="ganhador"></div>
    </div>
</div>

<script>
    function realizarSorteio() {
        const textarea = document.getElementById('nomes');
        const resultadoBox = document.getElementById('resultadoBox');
        const ganhadorDiv = document.getElementById('ganhador');

        // Pega o texto, divide por quebras de linha e remove espaços vazios
        const nomes = textarea.value.split('\n')
            .map(nome => nome.trim())
            .filter(nome => nome.length > 0);

        if (nomes.length === 0) {
            alert('Por favor, digite pelo menos um nome para o sorteio.');
            resultadoBox.style.display = 'none';
            return;
        }

        // Gera um índice aleatório baseado no tamanho do array de nomes
        const indiceAleatorio = Math.floor(Math.random() * nomes.length);
        const sorteado = nomes[indiceAleatorio];

        // Exibe o resultado na tela
        ganhadorDiv.innerText = sorteado;
        resultadoBox.style.display = 'block';
    }
</script>

</body>
</html>
